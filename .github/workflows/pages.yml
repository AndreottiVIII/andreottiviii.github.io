name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # le versioni piccole delle foto si rifanno solo per le foto nuove
      - uses: actions/cache@v4
        with:
          path: .cache
          key: img-w-${{ hashFiles('src/img/**') }}
          restore-keys: img-w-
      # PATH_PREFIX e MOCKUP si impostano per repo (Settings > Variables): vuote sul sito, "/lab/" e "true" nel laboratorio
      - run: npx eleventy
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
          MOCKUP: ${{ vars.MOCKUP }}
      # rete di sicurezza: se manca uno solo degli indirizzi vecchi il lavoro fallisce qui, prima del deploy
      - name: Rete di sicurezza (indirizzi vecchi, title, description)
        run: node scripts/check-urls.mjs
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
