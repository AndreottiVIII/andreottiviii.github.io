# Configurazione di Pages CMS (https://pagescms.org) per davidecaniatti.com
# Gli stessi file si possono modificare a mano via git: il pannello legge e scrive Markdown + frontmatter.

media:
  input: src/img
  output: /img
  extensions: [jpg, jpeg, png, webp]
  rename: safe

content:
  # ---------------- Articoli ----------------
  - name: posts
    label: Articoli
    type: collection
    path: src/posts
    filename: "{primary}.md"
    exclude: [posts.11tydata.js]
    view:
      fields: [title, date, categories]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
      - name: date
        label: Data
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: description
        label: Descrizione per Google (meta description)
        type: text
      - name: seo_title
        label: Titolo per Google (se diverso dal titolo; il sito aggiunge " — Davide Caniatti")
        type: string
      - name: labels
        label: Etichette
        type: string
        list: true
      - name: categories
        label: Categoria
        type: string
        list: true
        description: "Quelle in uso: Foveon, Cameras, Lenses."
      - name: author
        label: Autore (se compare "Written by")
        type: string
      - name: cover
        label: Immagine di copertina (anteprime e condivisioni)
        type: image
      - name: excerpt
        label: Riassunto nell'elenco del blog e nella home
        type: text
      - name: permalink
        label: Indirizzo (lasciare vuoto per gli articoli nuovi; NON cambiarlo per quelli già pubblicati)
        type: string
      - name: body
        label: Testo
        type: rich-text
        description: "Una galleria è un elenco puntato di sole immagini. Una didascalia è una riga in corsivo subito sotto un'immagine."

  # ---------------- Gallerie del portfolio ----------------
  - name: galleries
    label: Gallerie (Work)
    type: collection
    path: src/galleries
    filename: "{primary}.md"
    exclude: [galleries.json]
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Nome nel menu
        type: string
        required: true
      - name: seo_title
        label: Titolo per Google
        type: string
      - name: description
        label: Descrizione per Google
        type: text
      - name: permalink
        label: Indirizzo (non cambiare)
        type: string
      - name: gallery
        label: Foto (nell'ordine in cui compaiono)
        type: object
        list: true
        fields:
          - name: image
            label: Foto
            type: image
          - name: alt
            label: Testo alternativo (per chi non vede la foto)
            type: text

  # ---------------- Pagine singole ----------------
  - name: home
    label: Home
    type: file
    path: src/pages/home.md
    fields:
      - { name: seo_title, label: Titolo per Google, type: string }
      - { name: description, label: Descrizione per Google, type: text }
      - name: hero
        label: Foto in alto
        type: object
        fields:
          - { name: image, label: Foto, type: image }
          - { name: alt, label: Testo alternativo, type: text }
      - name: button
        label: Pulsante
        type: object
        fields:
          - { name: text, label: Testo, type: string }
          - { name: href, label: Indirizzo, type: string }
      - { name: latest_heading, label: Titolo "ultimi articoli", type: string }
      - { name: featured_label, label: Etichetta sopra gli articoli, type: string }
      - name: slideshow
        label: Foto a scorrimento in fondo
        type: object
        list: true
        fields:
          - { name: image, label: Foto, type: image }
          - { name: alt, label: Testo alternativo, type: text }
      - { name: body, label: Presentazione, type: rich-text }

  - name: about
    label: About me
    type: file
    path: src/pages/contact-davidecaniatti.md
    fields:
      - { name: seo_title, label: Titolo per Google, type: string }
      - { name: description, label: Descrizione per Google, type: text }
      - { name: image, label: Foto, type: image }
      - { name: image_alt, label: Testo alternativo della foto, type: text }
      - { name: body, label: Testo, type: rich-text }

  - name: index
    label: Index (elenco degli articoli)
    type: file
    path: src/pages/blog-index.md
    fields:
      - { name: seo_title, label: Titolo per Google, type: string }
      - { name: description, label: Descrizione per Google, type: text }
      - { name: image, label: Foto, type: image }
      - { name: image_alt, label: Testo alternativo della foto, type: text }
      - { name: body, label: Testo, type: rich-text }
